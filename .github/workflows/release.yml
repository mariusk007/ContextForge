name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read version from tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish self-contained (no .NET install needed)
        shell: pwsh
        run: >
          dotnet publish ContextForge/ContextForge.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:Version=$env:VERSION
          -o out/self-contained

      - name: Publish framework-dependent (requires .NET 10 Desktop Runtime)
        shell: pwsh
        run: >
          dotnet publish ContextForge/ContextForge.csproj -c Release -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:DebugType=none
          -p:Version=$env:VERSION
          -o out/framework-dependent

      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive out/self-contained/* "ContextForge-v$env:VERSION-win-x64.zip"
          Compress-Archive out/framework-dependent/* "ContextForge-v$env:VERSION-win-x64-framework-dependent.zip"

      - uses: softprops/action-gh-release@v2
        with:
          name: ContextForge v${{ env.VERSION }}
          generate_release_notes: true
          files: |
            ContextForge-v${{ env.VERSION }}-win-x64.zip
            ContextForge-v${{ env.VERSION }}-win-x64-framework-dependent.zip